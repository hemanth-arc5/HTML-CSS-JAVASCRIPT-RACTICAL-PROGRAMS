<!DOCTYPE html>
<html>
<head>
    <title>CSS Example</title>

    <!-- external CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- internal CSS -->
    <style>
        h1 {
            color: blue;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Styling</h1>

    <p>This paragraph uses internal CSS.</p>

    <div class="box">
        This box uses external CSS.
    </div>

</body>
</html>

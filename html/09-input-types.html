<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>
</head>
<body>

    <h1>HTML5 Form</h1>

    <form>

        Email:
        <input type="email">
        <br><br>

        Password:
        <input type="password">
        <br><br>

        Date of Birth:
        <input type="date">
        <br><br>

        Age:
        <input type="number" min="1" max="100">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>

        /* Element selector */
        h1 {
            color: blue;
            font-family: Arial;
        }

        /* Class selector */
        .para {
            color: green;
            font-size: 20px;
        }

        /* ID selector */
        #box {
            background-color: yellow;
            margin: 30px;
            padding: 20px;
            border: 3px solid black;
        }

    </style>
</head>
<body>

    <h1>CSS Selectors</h1>

    <p class="para">
        This paragraph demonstrates CSS styling.
    </p>

    <div id="box">
        Margin, padding and border example.
    </div>

</body>
</html>

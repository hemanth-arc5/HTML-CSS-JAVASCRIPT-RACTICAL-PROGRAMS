<!DOCTYPE html>
<html>
<head>

    <title>My Portfolio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #444;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            padding: 40px;
            text-align: center;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .skill {
            background-color: white;
            padding: 20px;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media screen and (max-width: 600px) {

            nav a {
                display: block;
                margin: 10px;
            }

            section {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

    <header>
        <h1>Hemanth</h1>
        <p>Student | Web Developer</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about">

        <h2>About Me</h2>

        <p>
            Hello! I am a student interested in web development
            and technology.
        </p>

    </section>

    <section id="skills">

        <h2>My Skills</h2>

        <div class="skills">

            <div class="skill">
                <h3>HTML</h3>
                <p>Web Structure</p>
            </div>

            <div class="skill">
                <h3>CSS</h3>
                <p>Web Styling</p>
            </div>

            <div class="skill">
                <h3>JavaScript</h3>
                <p>Web Development</p>
            </div>

        </div>

    </section>

    <section id="contact">

        <h2>Contact Me</h2>

        <p>Email: example@gmail.com</p>
        <p>Phone: 9876543210</p>

    </section>

    <footer>

        <p>© 2026 My Portfolio</p>

    </footer>

</body>
</html>
